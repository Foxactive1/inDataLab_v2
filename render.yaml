services:
  - type: web
    name: indatalab-api
    runtime: python
    plan: free
    buildCommand: pip install --only-binary=:all: -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: E2B_SANDBOX_TIMEOUT
        value: "3600"
      - key: E2B_EXECUTION_TIMEOUT
        value: "30"
      - key: E2B_MAX_DATASET_BYTES
        value: "26214400"
      - key: ENABLE_KERNELS
        value: "false"
